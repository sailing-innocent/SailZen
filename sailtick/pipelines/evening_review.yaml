id: evening_review
name: Evening Review Tick
description: 18:00 唤醒。晚间复盘：三项核对、晚饭计划、明日预排；周日做 weekly review。
slot: evening_review
nodes:
  - id: scan
    type: tick_scan
    name: 数据扫描与票据同步
    params:
      days: 7
  - id: weight_trend
    type: weight_trend
    name: 体重趋势
    depends_on: [scan]
    params:
      days: 14
  - id: plan
    type: tick_plan
    name: LLM 生成晚间计划
    depends_on: [weight_trend]
    params:
      prompt_slot: evening_review
  - id: handoff
    type: handoff_write
    name: 写交接文档
    depends_on: [plan]
