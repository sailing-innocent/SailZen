id: daily_standup
name: Daily Standup & Agenda Digest
description: >
  Fetches calendar and tasks, summarizes today's focus,
  and sends a digest via Lark IM.
  Schedule: 0 8 * * 1-5 (8:00 AM, Mon-Fri)

autonomy_level: fully_autonomous

nodes:
  - id: health_check
    type: state_check
    name: Check sail_server health
    params:
      endpoint: "http://localhost:1974/api/v1/health"
      expected_status: 200
      timeout: 10

  - id: standup_data
    type: sailzen_cli
    name: Fetch finance summary for context
    depends_on: [health_check]
    params:
      module: finance
      command: pull
      args: ["--days", "7", "--output", "weekly.csv"]
      timeout: 120

  - id: summarize
    type: llm_reasoning
    name: Summarize and prioritize
    depends_on: [standup_data]
    params:
      prompt_template: |
        Based on the following recent finance activity and today's date,
        generate a brief daily standup focus summary in Chinese.

        Recent transactions (last 7 days):
        {{ upstream.standup_data.stdout }}

        Today's date: {{ today | default('') }}

        Output a brief digest with:
        1. Top 3 priorities for today
        2. Any financial alerts or reminders
        3. A motivational one-liner
      provider: kimi
      temperature: 0.3
      max_tokens: 1500

  - id: check_priority
    type: condition
    name: Check if summary exists
    depends_on: [summarize]
    params:
      condition: "upstream.summarize is not none"
      true_next: [send_digest]
      false_next: []

  - id: send_digest
    type: lark_notify
    name: Send digest to user IM
    depends_on: [check_priority]
    params:
      channel: im
      content: |
        🌅 今日Standup摘要

        {{ upstream.summarize.response }}
      content_type: markdown
