[project]
name = "sailzen-orm"
version = "0.3.0"
description = "SailZen shared database schema declarations (SQLAlchemy ORM)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy>=2.0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sailzen_orm"]
