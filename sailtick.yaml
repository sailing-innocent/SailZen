# =============================================================================
# SailTick 私人减肥监督教练 — 配置文件模板
# 复制为仓库根目录 sailtick.yaml 并按服务器实际情况填写。
# 环境变量（SAILTICK_*）优先级高于本文件，见 .env.template 的 SAILTICK 段。
# =============================================================================
sailtick:
  # ── 基础 ──────────────────────────────────────────────────────────
  name: sailtick
  data_dir: data/sailtick            # 隔离数据目录（禁止 db_sync，已加排除）
  db_path: data/sailtick/db/sailtick.db
  log_dir: logs/sailtick
  api_host: 127.0.0.1                # 管理 API 监听地址（同机部署用 127.0.0.1）
  api_port: 9070                     # 避开 dag_client 9050 / 旧 agent 9060
  timezone: Asia/Shanghai
  heartbeat_interval: 30             # 心跳间隔（秒）
  inbox_poll_seconds: 600            # 收件箱轮询间隔（秒）

  # ── Tick 排程 ─────────────────────────────────────────────────────
  tick:
    hours: [0, 6, 12, 18]            # 唤醒时刻表（已确认；周末无差异）
    pre_sleep_report_time: "21:45"   # 每日睡前体重与健康日报时间（安静时段 23:00 前）
    work_budget_minutes: 180         # 每次 3 小时工作预算
    scan_budget_minutes: 15
    plan_budget_minutes: 20
    handoff_budget_minutes: 10

  # ── LLM ───────────────────────────────────────────────────────────
  # 决议：deepseek flash 级视为无限量；记账与软上限仅防代码 bug 失控。
  llm:
    default: deepseek
    fast_provider: deepseek          # 白天快反代理 provider（留空沿用 default）
    fast_model: deepseek-chat        # 白天快反代理模型（非推理低延迟，1-3s 响应）
    per_tick_token_cap: 200000       # 每 Tick 软上限
    daily_token_cap: 1000000         # 每日软上限
    providers:
      deepseek:
        model: deepseek-reasoner
        base_url: https://api.deepseek.com/v1
        api_key: ${DEEPSEEK_API_KEY}   # 从环境变量注入，勿填明文
      # kimi:
      #   model: kimi-k2.5
      #   base_url: https://api.moonshot.cn/v1
      #   api_key: ${KIMI_API_KEY}     # 同时兼容 MOONSHOT_API_KEY

  # ── 灰度开关与熔断（off / shadow / canary / live） ─────────────────
  # 可通过 CLI (`sailtick canary set <mode>`) 或管理 API (`POST /canary/switch`) 一键热切。
  canary:
    mode: live                         # 建议上线顺序: shadow -> canary -> live
    allow_push: true                   # canary 预设自动关闭手机推送
    allow_self_dev: true               # canary/shadow 预设自动禁用自我开发
    max_tickets_per_tick: 2            # canary 预设自动限流至 1
    allowed_slots: []                  # 空=全部 slot；灰度可限定如 [midday_checkin]
    ticket_title_prefix: ""            # 灰度可选前缀，如 "[Canary] "
    auto_downgrade_failures: 3         # 连续失败达到阈值自动熔断降级
    auto_downgrade_target: shadow      # 熔断目标模式: shadow | off

  # ── sail_server（同机部署） ────────────────────────────────────────
  sail_server:
    api_base: http://127.0.0.1:1974/api/v1   # 按服务器实际端口填写
    auth_token: ${SAILZEN_API_TOKEN}         # 与 sail_server 同一 token

  # ── 通知 ──────────────────────────────────────────────────────────
  notify:
    quiet_hours:
      start: 23                        # 安静时段 23:00–08:00（已确认为默认）
      end: 8
    push_enabled: true                 # 提问与日报经 sail_server Reminder + WS 推送手机
    dedup_window_seconds: 3600
    max_questions_per_tick: 1          # 渐进细化：每 Tick 最多提 1 个问题，不轰炸用户
    max_pending_questions: 2           # 已有 2 个未回复提问时暂缓新提问
    topic_cooldown_hours: 24           # 同话题 24 小时冷却防重复

  # ── 夜间深度自维护（长周期分析 + 数学建模 + 自主查食物热量 + 健康师知识库） ──
  nightly:
    enabled: true
    deep_window_days: 90             # 长周期体重与交易分析窗口（天）
    enable_modeling: true            # 数学建模（EWMA + 回归/动力学模型 + 70kg 预测区间）
    enable_food_research: true       # 自动发现未知食物并自主联网/结构化查证热量
    enable_knowledge_curation: true  # 按当前痛点自主整理运动/饮食/心理专业知识卡片
    enable_web_search: true          # 允许公网检索（失败优雅降级为本地基准 + LLM）
    max_foods_per_night: 5           # 单次夜间最多深度调研食物条数
    max_knowledge_per_night: 2       # 单次夜间最多整理知识卡片数
    enable_finance_backfill: true    # 历史账单夜间慢迭代（按月倒推 + 水位限流，不急于一时）
    finance_backfill_pending_cap: 5  # 待审清理队列 >= 该水位时暂停历史深挖，绝不堆负担
    finance_backfill_max_new_reviews_per_night: 3  # 每晚历史回溯最多新增待审建议数
    finance_backfill_max_llm_items_per_night: 4    # 阶段2慢脑每晚最多辅助研判长尾未标账单数

  # ── 白天快速对话代理（转达 SailTick 专家结论 + 灵活调计划 + 顺手设提醒） ─────
  quick_chat:
    enabled: true
    history_turns: 8                 # 短期对话上下文保留条数
    default_offwork_time: "18:00"    # 画像未记录下班时间时的默认下班时刻
    offwork_lead_minutes: 20         # 「下班前提醒」默认提前分钟数
    allow_plan_adjust_signal: true   # 突发聚餐/早下班信号自动同步给慢脑
    allow_reminder_create: true      # 支持一句话创建定时提醒（落库 sail_server Reminder）

  # ── QQ Bot 接入（OneBot v11 HTTP Webhook + 主动提醒推送，对接 NapCat/Lagrange）─
  qq_bot:
    enabled: false                   # 部署 NapCat/Lagrange 后改为 true（或配 SAILTICK_QQ_ENABLED=true）
    onebot_api_base: ${SAILTICK_QQ_ONEBOT_URL}     # 如 http://127.0.0.1:3000
    access_token: ${SAILTICK_QQ_ACCESS_TOKEN}
    webhook_secret: ${SAILTICK_QQ_WEBHOOK_SECRET}
    allowed_users: []                # 生产建议只填主人 QQ 号（或 SAILTICK_QQ_ALLOWED_USERS）
    allowed_groups: []
    primary_user_id: ${SAILTICK_QQ_PRIMARY_USER}
    nudge_poll_seconds: 30

  # ── 自我开发（Phase 5，可选） ──────────────────────────────────────
  # repo_dir: 服务器上本仓库的路径。部署时填写（验收文档 §前置检查）。
  # 严禁 push origin（项目铁律）；严禁直动 main。
  self_dev:
    repo_dir: ""                       # 例: /home/<user>/SailZen
    branch: agent/sailtick-dev
    whitelist_dirs:
      - sailtick
      - tests/sailtick
      - doc/design/agent-system
    protected_paths:
      - data
      - .env
      - .env.dev
      - .env.prod
      - .env.debug
      - .git
