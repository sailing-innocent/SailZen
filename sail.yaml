# SailZen DAG Client 配置示例
# 放置于项目根目录或工作目录，或设置 SAIL_CONFIG 环境变量指向此文件

dag_client:
  # 实例名称
  name: "default"

  # 数据存储路径（相对于此配置文件）
  db_path: "data/dag_client.db"
  data_dir: "data/dag"
  log_dir: "logs/dag"

  # API 服务配置
  api_port: 9050
  api_host: "0.0.0.0"

  # 是否自动启动执行器
  auto_start: true

  # 最大并发运行数
  max_concurrent_runs: 5

  # Agent 心跳间隔（秒）
  heartbeat_interval: 30

  # OpenCode 服务器连接配置
  opencode:
    host: "127.0.0.1"
    port: 4096
    timeout: 30.0
    sse_timeout: 14400.0

  # 节点类型定义
  # 内置类型: skill, shell, python
  # 自定义类型通过 handler 指定导入路径
  node_types:
    - name: "skill"
      handler: "sailzen.dag_client.nodes.skill_node.SkillNode"
      default_timeout: 3600
    - name: "shell"
      handler: "sailzen.dag_client.nodes.shell_node.ShellNode"
      default_timeout: 300
    - name: "python"
      handler: "sailzen.dag_client.nodes.python_node.PythonNode"
      default_timeout: 300
    - name: "text_fetch"
      handler: "sailzen.dag_client.nodes.text_fetch_node.TextFetchNode"
      default_timeout: 60
    - name: "batch_split"
      handler: "sailzen.dag_client.nodes.novel_analysis_nodes.BatchSplitNode"
      default_timeout: 60
    - name: "batch_merge"
      handler: "sailzen.dag_client.nodes.novel_analysis_nodes.BatchMergeNode"
      default_timeout: 60
    - name: "report"
      handler: "sailzen.dag_client.nodes.novel_analysis_nodes.ReportNode"
      default_timeout: 60
    - name: "batch_text_collector"
      handler: "sailzen.dag_client.nodes.novel_analysis_nodes.BatchTextCollectorNode"
      default_timeout: 300

  # 框架必需的 skills（启动时会检查可用性）
  required_skills:
    - "sailzen-dev-guide"

  # 预定义流水线模板
  # 可通过 API POST /api/v1/dag/runs 基于 definition_id 创建运行
  pipelines:
    - id: "example_pipeline"
      name: "示例流水线"
      description: "一个展示 DAG 能力的示例流水线"
      nodes:
        - id: "init"
          type: "shell"
          name: "初始化"
          params:
            command: "echo 'Starting pipeline...'"

        - id: "analysis"
          type: "skill"
          name: "分析"
          depends_on: ["init"]
          params:
            skill: "sailzen-dev-guide"
            prompt: "分析当前项目结构"

        - id: "report"
          type: "python"
          name: "生成报告"
          depends_on: ["analysis"]
          params:
            code: |
              result = {
                  "message": "Pipeline completed",
                  "upstream": ctx.upstream_results
              }
              print(result)

    - id: "build_pipeline"
      name: "构建流水线"
      description: "编译与测试"
      nodes:
        - id: "lint"
          type: "shell"
          name: "代码检查"
          params:
            command: "echo 'Running linter...'"

        - id: "build"
          type: "shell"
          name: "编译"
          depends_on: ["lint"]
          params:
            command: "echo 'Building...'"

        - id: "test"
          type: "shell"
          name: "测试"
          depends_on: ["build"]
          params:
            command: "echo 'Running tests...'"

    - id: "novel_analysis"
      name: "网文拆解分析"
      description: "超长网文的多维度拆解分析流水线"
      global_params:
        sail_server_url: "http://localhost:8000"
        batch_size: 100
        max_workers: 4
        analysis_types: ["character", "plot", "setting", "emotion"]
      nodes:
        - id: "fetch_work_meta"
          type: "text_fetch"
          name: "获取作品元数据"
          params:
            endpoint: "work_meta"
            # 运行时通过 POST /runs 的 params.work_id 传入
            work_id: null

        - id: "fetch_chapter_index"
          type: "text_fetch"
          name: "获取章节索引"
          depends_on: ["fetch_work_meta"]
          params:
            endpoint: "chapters"
            # 运行时通过 POST /runs 的 params.edition_id 传入
            edition_id: null

        - id: "batch_split"
          type: "batch_split"
          name: "批次切分"
          depends_on: ["fetch_chapter_index"]
          params:
            batch_size: 100
            overlap: 0
            strategy: "by_count"

        # 注意: batch_fetch_N 和 analyze_*_N 节点由 batch_split 动态生成
        # 以下占位节点用于展示模板结构，实际运行时动态创建

        - id: "merge_character"
          type: "batch_merge"
          name: "合并角色分析"
          depends_on: ["batch_split"]
          params:
            dimension: "character"
            merge_strategy: "dedup"

        - id: "merge_plot"
          type: "batch_merge"
          name: "合并剧情分析"
          depends_on: ["batch_split"]
          params:
            dimension: "plot"
            merge_strategy: "concat"

        - id: "merge_setting"
          type: "batch_merge"
          name: "合并设定分析"
          depends_on: ["batch_split"]
          params:
            dimension: "setting"
            merge_strategy: "concat"

        - id: "merge_emotion"
          type: "batch_merge"
          name: "合并情感分析"
          depends_on: ["batch_split"]
          params:
            dimension: "emotion"
            merge_strategy: "concat"

        - id: "generate_report"
          type: "report"
          name: "生成综合报告"
          depends_on:
            - "merge_character"
            - "merge_plot"
            - "merge_setting"
            - "merge_emotion"
          params:
            template: "default"
            include_raw: false
